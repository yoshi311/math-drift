<!doctype html><html><head><meta charset="utf-8"></head>
<body style="background:#2a2f3a;margin:0;display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:4px;font:12px sans-serif;color:#fff">
<script type="module">
// 開発用：全車種の一覧（?v=1 でカスタム例も表示）
import { CARS } from '../data/cars.js'; import { carSVG } from '../js/components/car-render.js';
const v = [{}, { wing: 3, lip: 3, skirt: 2, height: -5, wheel: '6spoke', inch: 18, neon: '#00e5ff', livery: 'number', tint: 2, bonnet: true }, { wing: 2, livery: 'fire', wheel: 'deep', wcolor: '#e2b33c', inch: 17, height: -3 }, { wing: 1, livery: 'stripe', wheel: 'disc', tone: true }];
document.body.style.setProperty("--c", new URLSearchParams(location.search).get("c") || 4);
const mode = +(new URLSearchParams(location.search).get('v') || 0);
CARS.forEach((c, i) => { const d = document.createElement('div'); d.style.background = '#1b1f27'; d.innerHTML = c.id + carSVG(c.id, mode ? v[i % 4] : {}); document.body.appendChild(d); });
</script></body></html>

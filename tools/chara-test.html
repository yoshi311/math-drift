<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet"></head>
<body style="background:#0b0d14;margin:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font:11px sans-serif;color:#fff">
<script type="module">
import { CHARS } from '../data/story/index.js';
import { charaSVG, meLook } from '../js/components/chara.js';
const ex = new URLSearchParams(location.search).get('e');
const exprs = ex ? [ex] : ['normal'];
for (const [k, c] of Object.entries(CHARS)) {
  if (!c.look) continue;
  for (const e of exprs) {
    const d = document.createElement('div');
    d.style.cssText = 'background:#1a2030;text-align:center';
    d.innerHTML = charaSVG(c.look === 'me' ? meLook({}) : c.look, e) + k + ' ' + e;
    document.body.appendChild(d);
  }
}
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><base href="../"><link rel="stylesheet" href="css/hud.css"></head>
<body style="background:#0b0d14;margin:0;display:grid;grid-template-columns:repeat(var(--c,7),1fr);gap:4px;font:11px sans-serif;color:#fff">
<script type="module">
// 開発用：キャラ立ち絵の一覧（?c=列数 &e=表情 &k=キー,キー &d=-1 で左向き）
import { CHARS } from './data/story/index.js';
import { CHARA_IMG, charaImgHTML } from './js/components/chara-img.js';
const qs = new URLSearchParams(location.search); document.body.style.setProperty('--c', qs.get('c') || 7);
const only = qs.get('k') ? qs.get('k').split(',') : null, e = qs.get('e') || 'normal', d = +(qs.get('d') || 1);
for (const k of Object.keys(CHARA_IMG)) {
  if (only && !only.includes(k)) continue;
  const div = document.createElement('div');
  div.style.cssText = 'background:#1a2030;text-align:center';
  div.innerHTML = charaImgHTML(k, e, d, (CHARS[k] || CHARS.me).color) + k;
  document.body.appendChild(div);
}
</script></body></html>
